name: Reel Publisher (Facebook Post)

on:
  schedule:
    - cron: '0 1,13 * * *'  # 2 times a day optimized for US Audience: 9:00 AM EST & 9:00 PM EST (13:00 & 01:00 UTC)
  workflow_dispatch:        # Allows manual run from GitHub UI


jobs:
  publish-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Reel Publisher Workflow
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_SYSTEM_USER_TOKEN: ${{ secrets.FB_SYSTEM_USER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python publisher_workflow.py

      - name: Commit & Push Updated History & Video Store
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add published_history.jsonl video_store/
          git commit -m "Auto-update published_history and video_store [skip ci]" || echo "No changes to commit"
          git push
